# SD card layout for A/B updates. The byte-level contract, and the five files that
# have to agree on these numbers, are in
# specs/002-ab-ota-rauc/contracts/storage-layout.md.
#
# The kernel and device tree live inside each OS slot, so the boot partition holds
# only the two bootloader stages and no update ever writes it. MBR, not GPT: the
# AM335x ROM looks through MBR entries for a bootable FAT partition and finds
# nothing on a GPT medium. That spends all four primary partitions, which is why the
# boot-selection state is a reserved region rather than a partition of its own.

image boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img"
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	# Boot-selection state: in no filesystem and no partition table entry, in the
	# gap above the offsets the ROM scans for a raw boot image. Both copies are
	# seeded, because fw_printenv cannot see U-Boot's compiled-in default
	# environment and an unseeded region would fail its health check on first boot.
	partition env {
		in-partition-table = false
		offset = 0x80000
		image = "uboot-env.bin"
	}

	partition env-redund {
		in-partition-table = false
		offset = 0xa0000
		image = "uboot-env.bin"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}

	# Empty in the factory image; the first update writes it.
	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}

	# Reserved for /data. Its filesystem arrives together with the mount point in
	# the rootfs overlay.
	partition data {
		partition-type = 0x83
		size = 256M
	}
}
