# RAUC on beaglebone_black. The device paths here are the same ones
# specs/002-ab-ota-rauc/contracts/storage-layout.md fixes for genimage.cfg,
# fw_env.config and fstab; a disagreement between any two of them is silent.

[system]
compatible=ota-beaglebone-black
bootloader=uboot
# Slot status, including which slot is bad and why, has to outlive the reboot that
# reveals the failure and the overwriting of the failed slot, so it lives on the
# persistent data area rather than in a slot or in volatile storage (FR-014).
statusfile=/data/rauc.status
bundle-formats=plain
# RAUC mounts the bundle and, during an install, its slots under this prefix. The default,
# /mnt/rauc, is on the read-only slot, where the mount point cannot be created.
mountprefix=/run/rauc

[keyring]
# The development CA, installed by board/ota/common/post-build.sh from $OTA_KEYRING.
path=/etc/rauc/keyring.pem
# The signing certificate carries the Code Signing extended key usage and no other, which
# is what a bundle signer should have. Without this line OpenSSL checks the chain for the
# S/MIME signing purpose instead and refuses it: "unsuitable certificate purpose". This is
# RAUC's own code-signing check, which also rejects a certificate that lacks the usage.
check-purpose=codesign

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
