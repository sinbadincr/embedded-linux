# SD card layout for the peripheral lab board: one boot partition and one writable
# rootfs, with no A/B slots and no reserved boot-selection region. The kernel and
# device tree sit in the boot partition, next to the bootloader that loads them.

image boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"am335x-boneblack-control.dtb",
			"uEnv.txt",
			"extlinux"
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}
}
